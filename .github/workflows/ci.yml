name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest
    - name: Run tests
      run: |
        pytest -q --tb=no

  build-apk:
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential git python3-pip python3-setuptools \
          openjdk-17-jdk ccache libncurses5 libtinfo6 libstdc++6 zlib1g-dev
    - name: Install Buildozer
      run: |
        pip install buildozer
    - name: Cache Buildozer artifacts
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}-v2
    - name: Generate self-signed keystore for release
      run: |
        keytool -genkey -v -keystore wavebrute.keystore -keyalg RSA -keysize 2048 \
          -validity 10000 -alias wavebrute -dname "CN=WaveBrute Team, OU=Dev, O=WaveBrute, C=US" \
          -storepass "wavebrute123" -keypass "wavebrute123" -noprompt
    - name: Configure buildozer.spec for signed release
      run: |
        sed -i 's/# android.release = False/android.release = True/' buildozer.spec
        sed -i 's|# android.keystore = .*|android.keystore = wavebrute.keystore|' buildozer.spec
        sed -i 's|# android.keystore_password = .*|android.keystore_password = wavebrute123|' buildozer.spec
        sed -i 's|# android.keyalias = .*|android.keyalias = wavebrute|' buildozer.spec
        sed -i 's|# android.keyalias_password = .*|android.keyalias_password = wavebrute123|' buildozer.spec
    - name: Build signed APK
      run: |
        buildozer -v android release
    - name: Prepare release asset
      run: |
        mkdir -p bin
        mv bin/*-release-*.apk bin/wavebrute-signed.apk || cp bin/*.apk bin/wavebrute-signed.apk
        echo "Signed APK ready: $(ls -lh bin/wavebrute-signed.apk)"
    - name: Upload signed APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/wavebrute-signed.apk
        tag_name: ${{ github.ref_name }}
        name: WaveBrute ${{ github.ref_name }}
        body: |
          Prebuilt signed Android APK (simulation-first, ethical auditing toolkit).
          
          Install on Android 8.0+. All live operations require explicit consent.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
